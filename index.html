<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15171a" />
    <meta name="description" content="SIMA: nível da água e lixo nos bueiros monitorados de São Paulo e chance de alagar nas próximas 3 horas." />
    <!-- Ícone e modo "app": com "Adicionar à Tela de Início" (iPhone) ou "Instalar app" (Android),
         o SIMA abre em tela cheia, sem a barra do navegador. -->
    <link rel="icon" type="image/png" href="./icone-192.png" />
    <link rel="apple-touch-icon" href="./icone-apple.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIMA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SIMA · Mapa de risco</title>
    <script>
      // Aplica o tema e a preferência de animações antes do primeiro desenho, para a tela não piscar
      // na cor errada. As mesmas regras estão em src/preferencias/PreferenciasContexto.jsx.
      (function () {
        var prefs = {};
        try { prefs = JSON.parse(localStorage.getItem("sima.preferencias") || "{}") || {}; } catch (e) {}
        var tema = prefs.tema;
        if (tema !== "claro" && tema !== "escuro") {
          tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
        }
        var pedeMenos = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var reduzir = prefs.animacoes === "reduzidas" || (prefs.animacoes !== "ligadas" && pedeMenos);
        document.documentElement.className = (tema === "claro" ? "thm-light" : "thm-dark") + (reduzir ? " mov-reduzido" : "");
      })();
    </script>
    <style>
      /* Cores mínimas para antes de o CSS do app chegar, e para o aviso de "não abriu" (abaixo),
         que precisa aparecer mesmo se o CSS não chegar. */
      html.thm-dark { background: #15171a; color: #e6e8ea; }
      html.thm-light { background: #f3f2f0; color: #1c1e21; }
      .sem-app { max-width: 340px; margin: 0 auto; padding: 22vh 24px 0; text-align: center; font: 17px/1.45 system-ui, sans-serif; }
      .sem-app b { font-size: 22px; }
      .sem-app button { margin-top: 18px; min-height: 50px; padding: 0 26px; border: 0; border-radius: 25px; background: #1f6fd6; color: #ffffff; font: 700 17px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>O SIMA precisa de JavaScript para mostrar o mapa.</noscript>
    <script>
      // Se o código do app não chegar (internet fraca, queda no meio do carregamento), a pessoa vê um
      // aviso com "Tentar de novo" em vez de uma tela vazia. Quando o app abre, ele ocupa o lugar do
      // aviso sozinho.
      (function () {
        function avisar() {
          var raiz = document.getElementById("raiz");
          if (!raiz || raiz.firstChild) return; // o app já abriu (ou o aviso já está na tela)
          raiz.innerHTML = '<div class="sem-app" role="alert"><p><b>O SIMA não abriu</b></p>'
            + '<p>A internet pode estar fraca. Confira a conexão e tente de novo.</p>'
            + '<button type="button" onclick="location.reload()">Tentar de novo</button></div>';
        }
        // O arquivo do app falhou ao carregar: avisa na hora.
        window.addEventListener("error", function (evento) {
          var alvo = evento.target;
          if (alvo && alvo.tagName === "SCRIPT" && alvo.type === "module") avisar();
        }, true);
        // Nada na tela depois de 15 segundos: avisa também (o app continua tentando por baixo).
        setTimeout(avisar, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
